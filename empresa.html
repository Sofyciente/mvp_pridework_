<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="empresa-perfil.css">
</head>
<body>
<header>
    <nav class="navbar">
        <a href="index.html" class="logo">Pride<span>Work</span></a>
        <div class="menu">
            <a href="index.html#vagas">Vagas de emprego</a>
            <a href="denunciar.html">Denunciar</a>
            <a href="fórum.html">Fórum</a>
            <a href="feedback.html">Feedback</a>
        </div>
    </nav>
</header>
<main class="company-page">
    <div class="company-layout">
        <div class="company-main">
            <a class="company-back" href="javascript:history.back()">← Voltar</a>
            <div id="companyProfile"><div class="company-loading">Carregando perfil...</div></div>
        </div>
        <aside class="company-aside">
            <section class="company-side-card">
                <h2>Páginas que as pessoas também viram</h2>
                <div id="similarCompanies"></div>
                <a class="company-see-all" href="index.html#vagas">Explorar empresas →</a>
            </section>
            <section class="company-side-card">
                <h2>As pessoas também seguem</h2>
                <div id="followedCompanies"></div>
            </section>
        </aside>
    </div>
</main>
<footer>
    <div class="footer-content">
        <strong>PrideWork</strong>
        <p>© 2026 PrideWork. MVP acadêmico.</p>
    </div>
</footer>
<script>
const companies = [{"nome": "NovaCorp", "area": "Serviços corporativos e operações", "slogan": "Organizando processos para empresas crescerem melhor.", "sobre": "A NovaCorp é uma empresa fictícia de serviços corporativos que apoia organizações em rotinas administrativas, gestão de documentos e melhoria de processos. Seu trabalho combina organização operacional, atendimento interno e padronização de atividades para que as equipes possam focar em suas prioridades.", "sede": "São Paulo, SP", "fundacao": "2016", "porte": "201-500 funcionários", "especialidades": ["Operações administrativas", "Gestão de processos", "Serviços corporativos"], "seguidores": "12.480", "theme": "theme-indigo"}, {"nome": "DataVision", "area": "Tecnologia, dados e inteligência de negócios", "slogan": "Transformando dados em decisões mais claras.", "sobre": "A DataVision é uma empresa fictícia de tecnologia que desenvolve soluções de análise de dados e inteligência de negócios. Atua com painéis gerenciais, indicadores, integração de bases e automação de relatórios para apoiar decisões em diferentes áreas.", "sede": "São Paulo, SP", "fundacao": "2018", "porte": "51-200 funcionários", "especialidades": ["Análise de dados", "Business Intelligence", "SQL e automação"], "seguidores": "8.730", "theme": "theme-blue"}, {"nome": "PeopleFirst", "area": "Recursos Humanos e desenvolvimento de pessoas", "slogan": "Pessoas no centro de cada oportunidade.", "sobre": "A PeopleFirst é uma consultoria fictícia de recursos humanos que apoia empresas em recrutamento, seleção, integração e desenvolvimento de talentos. A companhia trabalha para tornar os processos de contratação mais organizados e melhorar a experiência de candidatos e equipes.", "sede": "Sorocaba, SP", "fundacao": "2017", "porte": "51-200 funcionários", "especialidades": ["Recrutamento e seleção", "Treinamento", "Gestão de pessoas"], "seguidores": "6.920", "theme": "theme-violet"}, {"nome": "Vértice Engenharia", "area": "Engenharia e construção", "slogan": "Projetos sólidos, soluções duradouras.", "sobre": "A Vértice Engenharia é uma empresa fictícia de projetos e obras que atende clientes comerciais e industriais. Reúne equipes de planejamento, orçamento, acompanhamento de obras e segurança para conduzir projetos do estudo inicial à entrega.", "sede": "Campinas, SP", "fundacao": "2012", "porte": "201-500 funcionários", "especialidades": ["Planejamento de obras", "Orçamentos", "Gestão de projetos"], "seguidores": "9.140", "theme": "theme-teal"}, {"nome": "Aurora Saúde", "area": "Saúde e serviços clínicos", "slogan": "Cuidado próximo, gestão responsável.", "sobre": "A Aurora Saúde é uma rede fictícia de clínicas e serviços ambulatoriais. Sua operação integra atendimento ao público, equipes clínicas, gestão de agendas e áreas administrativas para oferecer uma experiência acolhedora e organizada.", "sede": "São Paulo, SP", "fundacao": "2015", "porte": "201-500 funcionários", "especialidades": ["Atendimento ao paciente", "Operações clínicas", "Gestão de saúde"], "seguidores": "14.600", "theme": "theme-rose"}, {"nome": "NexoLog", "area": "Logística e cadeia de suprimentos", "slogan": "Conectando estoques, rotas e pessoas.", "sobre": "A NexoLog é uma operadora logística fictícia especializada em armazenagem, distribuição e acompanhamento de entregas. Utiliza indicadores operacionais e planejamento de rotas para apoiar clientes de varejo e indústria.", "sede": "Guarulhos, SP", "fundacao": "2014", "porte": "501-1.000 funcionários", "especialidades": ["Logística", "Controle de estoque", "Distribuição"], "seguidores": "11.250", "theme": "theme-amber"}, {"nome": "VerdeVivo Sustentabilidade", "area": "Meio ambiente e sustentabilidade", "slogan": "Soluções práticas para um futuro mais sustentável.", "sobre": "A VerdeVivo é uma consultoria fictícia que auxilia empresas em projetos de sustentabilidade, gestão de resíduos, educação ambiental e acompanhamento de indicadores socioambientais.", "sede": "Curitiba, PR", "fundacao": "2019", "porte": "11-50 funcionários", "especialidades": ["Gestão ambiental", "Relatórios ESG", "Educação ambiental"], "seguidores": "4.380", "theme": "theme-indigo"}, {"nome": "PontoCerto Contábil", "area": "Contabilidade e consultoria financeira", "slogan": "Clareza financeira para decisões seguras.", "sobre": "A PontoCerto Contábil é um escritório fictício que oferece serviços contábeis, fiscais e de apoio financeiro para pequenas e médias empresas. A equipe trabalha com organização documental, fechamento contábil e orientação sobre rotinas empresariais.", "sede": "Santo André, SP", "fundacao": "2011", "porte": "11-50 funcionários", "especialidades": ["Contabilidade", "Fiscal e tributário", "BPO financeiro"], "seguidores": "3.960", "theme": "theme-blue"}, {"nome": "Conecta Telecom", "area": "Telecomunicações e atendimento", "slogan": "Conexões confiáveis para o dia a dia.", "sobre": "A Conecta Telecom é uma empresa fictícia de serviços de conectividade para clientes residenciais e empresariais. Atua com suporte técnico, relacionamento com clientes, instalação e acompanhamento de qualidade.", "sede": "São Bernardo do Campo, SP", "fundacao": "2013", "porte": "201-500 funcionários", "especialidades": ["Telecomunicações", "Suporte técnico", "Experiência do cliente"], "seguidores": "7.510", "theme": "theme-violet"}, {"nome": "Lumina Design", "area": "Design, comunicação e marketing", "slogan": "Marcas com propósito e experiências memoráveis.", "sobre": "A Lumina Design é um estúdio fictício de comunicação que desenvolve identidades visuais, campanhas digitais e materiais para marcas. Trabalha em parceria com clientes para transformar objetivos de negócio em soluções criativas.", "sede": "São Paulo, SP", "fundacao": "2020", "porte": "11-50 funcionários", "especialidades": ["Design gráfico", "Marketing digital", "Identidade de marca"], "seguidores": "5.270", "theme": "theme-teal"}, {"nome": "Atlas Educação", "area": "Educação e tecnologia educacional", "slogan": "Aprender abre novos caminhos.", "sobre": "A Atlas Educação é uma organização fictícia que desenvolve cursos, materiais didáticos e soluções de aprendizagem para estudantes e empresas. Sua equipe reúne profissionais de conteúdo, tecnologia e apoio acadêmico.", "sede": "Ribeirão Preto, SP", "fundacao": "2016", "porte": "51-200 funcionários", "especialidades": ["Educação corporativa", "Conteúdo didático", "Tecnologia educacional"], "seguidores": "6.140", "theme": "theme-rose"}, {"nome": "Orbe Financeira", "area": "Serviços financeiros e planejamento", "slogan": "Mais organização para a vida financeira.", "sobre": "A Orbe Financeira é uma empresa fictícia de serviços de planejamento e apoio financeiro. Desenvolve análises, relatórios e processos de atendimento para pessoas e pequenos negócios, com foco em clareza e organização.", "sede": "São Paulo, SP", "fundacao": "2018", "porte": "51-200 funcionários", "especialidades": ["Planejamento financeiro", "Análise de crédito", "Relacionamento"], "seguidores": "8.020", "theme": "theme-amber"}, {"nome": "CampoNobre Alimentos", "area": "Agronegócio e indústria alimentícia", "slogan": "Da origem à mesa, com cuidado em cada etapa.", "sobre": "A CampoNobre é uma empresa fictícia do setor de alimentos que coordena atividades de produção, qualidade, armazenagem e distribuição. Suas equipes acompanham padrões operacionais e processos de melhoria contínua.", "sede": "Ribeirão Preto, SP", "fundacao": "2009", "porte": "501-1.000 funcionários", "especialidades": ["Qualidade de alimentos", "Produção", "Cadeia de suprimentos"], "seguidores": "10.870", "theme": "theme-indigo"}, {"nome": "Prisma Jurídico", "area": "Serviços jurídicos empresariais", "slogan": "Orientação jurídica próxima e objetiva.", "sobre": "O Prisma Jurídico é um escritório fictício que presta apoio jurídico a empresas em contratos, organização documental e acompanhamento de demandas. O perfil institucional é demonstrativo e não representa um escritório real.", "sede": "São Paulo, SP", "fundacao": "2014", "porte": "11-50 funcionários", "especialidades": ["Contratos", "Direito empresarial", "Pesquisa jurídica"], "seguidores": "4.710", "theme": "theme-blue"}, {"nome": "RotaSul Transportes", "area": "Transporte e mobilidade", "slogan": "Movimentando pessoas e negócios com planejamento.", "sobre": "A RotaSul é uma transportadora fictícia que opera serviços de transporte e distribuição regional. A empresa reúne equipes de tráfego, atendimento, manutenção e planejamento para acompanhar a operação diária.", "sede": "Joinville, SC", "fundacao": "2010", "porte": "201-500 funcionários", "especialidades": ["Gestão de frota", "Planejamento de rotas", "Operações"], "seguidores": "7.890", "theme": "theme-violet"}, {"nome": "Mosaico Varejo", "area": "Comércio e varejo", "slogan": "Experiências de compra simples e humanas.", "sobre": "A Mosaico Varejo é uma rede fictícia de lojas de utilidades e produtos para o dia a dia. Atua em operações de loja, atendimento, compras, estoque e canais digitais, buscando integrar a experiência presencial e online.", "sede": "Osasco, SP", "fundacao": "2017", "porte": "501-1.000 funcionários", "especialidades": ["Operações de loja", "Vendas", "Gestão de estoque"], "seguidores": "13.300", "theme": "theme-teal"}, {"nome": "ByteForge Sistemas", "area": "Desenvolvimento de software", "slogan": "Software útil, equipes colaborativas.", "sobre": "A ByteForge Sistemas é uma empresa fictícia de desenvolvimento de software que cria aplicações web e ferramentas internas para clientes de diferentes setores. Trabalha com ciclos curtos de entrega, documentação e colaboração entre áreas técnicas e de produto.", "sede": "Florianópolis, SC", "fundacao": "2021", "porte": "51-200 funcionários", "especialidades": ["Desenvolvimento web", "Qualidade de software", "Produto digital"], "seguidores": "6.780", "theme": "theme-rose"}, {"nome": "Horizonte Energia", "area": "Energia e infraestrutura", "slogan": "Energia para projetos que movem o futuro.", "sobre": "A Horizonte Energia é uma empresa fictícia de serviços e projetos ligados à eficiência energética. Suas equipes apoiam estudos técnicos, acompanhamento de indicadores e iniciativas de melhoria em instalações comerciais.", "sede": "Belo Horizonte, MG", "fundacao": "2016", "porte": "51-200 funcionários", "especialidades": ["Eficiência energética", "Projetos", "Análise técnica"], "seguidores": "5.940", "theme": "theme-amber"}];
const params = new URLSearchParams(window.location.search);
const requestedName = params.get("nome");
const profileRoot = document.getElementById("companyProfile");
const similarRoot = document.getElementById("similarCompanies");
const followedRoot = document.getElementById("followedCompanies");

function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[char]);
}
function slug(value) {
    return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
function companyLink(company) {
    return "empresa.html?nome=" + encodeURIComponent(company.nome);
}
function miniCard(company, label) {
    return `<article class="company-mini">
        <a class="company-mini-logo ${company.theme || ""}" href="${companyLink(company)}">${esc(company.nome.slice(0,1))}</a>
        <div class="company-mini-info">
            <a class="company-mini-name" href="${companyLink(company)}">${esc(company.nome)}</a>
            <p>${esc(company.area)}</p>
            <small>${esc(company.seguidores)} seguidores</small>
            <a class="company-follow" href="${companyLink(company)}">＋ Ver perfil</a>
        </div>
    </article>`;
}
function renderError(title, message) {
    profileRoot.innerHTML = `<section class="company-error"><h1>${esc(title)}</h1><p>${esc(message)}</p><a class="company-button" href="index.html#vagas">Ver vagas</a></section>`;
}
if (!requestedName) {
    renderError("Empresa não informada","Volte às vagas e selecione o perfil de uma empresa.");
} else {
    Promise.all([
        fetch("vagas.json").then(response => {
            if (!response.ok) throw new Error();
            return response.json();
        })
    ]).then(([vacancies]) => {
        const company = companies.find(item => slug(item.nome) === slug(requestedName));
        if (!company) {
            renderError("Perfil não encontrado","Não encontramos essa empresa no cadastro do PrideWork.");
            return;
        }
        const companyJobs = vacancies.filter(job => slug(job.empresa) === slug(company.nome));
        const related = companies.filter(item => item.nome !== company.nome && item.area === company.area);
        const recommendations = [...related, ...companies.filter(item => item.nome !== company.nome && !related.includes(item))];
        document.title = `${company.nome} | PrideWork`;
        profileRoot.innerHTML = `
            <section class="company-hero">
                <div class="company-cover ${company.theme || ""}">
                    <span class="cover-pattern"></span>
                </div>
                <div class="company-identity">
                    <div class="company-logo-large ${company.theme || ""}">${esc(company.nome.slice(0,1))}</div>
                    <div class="company-heading">
                        <span class="company-verified">Perfil institucional · Empresa fictícia</span>
                        <h1>${esc(company.nome)} <span class="company-check">✓</span></h1>
                        <p>${esc(company.slogan)}</p>
                        <div class="company-meta">${esc(company.area)} <span>·</span> ${esc(company.sede)}</div>
                        <div class="company-meta">${esc(company.porte)} <span>·</span> ${esc(company.seguidores)} seguidores</div>
                    </div>
                    <a class="company-button company-follow-main" href="#companyJobs">＋ Ver vagas</a>
                </div>
                <nav class="company-tabs">
                    <a class="active" href="#overview">Início</a>
                    <a href="#overview">Sobre</a>
                    <a href="#companyJobs">Vagas</a>
                    <a href="#companyCommunity">Comunidade</a>
                </nav>
            </section>
            <section class="company-panel" id="overview">
                <h2>Visão geral</h2>
                <p>${esc(company.sobre)}</p>
                <div class="company-facts">
                    <div><span>Setor</span><strong>${esc(company.area)}</strong></div>
                    <div><span>Sede</span><strong>${esc(company.sede)}</strong></div>
                    <div><span>Fundação</span><strong>${esc(company.fundacao)}</strong></div>
                    <div><span>Porte</span><strong>${esc(company.porte)}</strong></div>
                </div>
                <h3>Especialidades</h3>
                <div class="company-specialties">${company.especialidades.map(item => `<span>${esc(item)}</span>`).join("")}</div>
                <p class="company-disclaimer">Perfil e informações criados para demonstração acadêmica do PrideWork. Esta empresa não representa uma organização real.</p>
            </section>
            <section class="company-panel" id="companyJobs">
                <div class="company-section-heading"><div><h2>Vagas em destaque</h2><p>Oportunidades cadastradas para esta empresa.</p></div><span class="company-job-count">${companyJobs.length} ${companyJobs.length === 1 ? "vaga" : "vagas"}</span></div>
                ${companyJobs.length ? `<div class="company-jobs">${companyJobs.map(job => `
                    <article class="company-job">
                        <div class="company-job-icon">${esc(company.nome.slice(0,1))}</div>
                        <div class="company-job-info">
                            <a href="vaga.html?id=${encodeURIComponent(job.id)}">${esc(job.titulo)}</a>
                            <p>${esc(company.nome)} · ${esc(job.localizacao)}</p>
                            <p>${esc(job.modalidade)} · ${esc(job.nivel)} · ${esc(job.tipo)}</p>
                            <strong>${esc(job.salario)}</strong>
                        </div>
                        <a class="company-job-link" href="vaga.html?id=${encodeURIComponent(job.id)}">Ver vaga →</a>
                    </article>`).join("")}</div>` : `<p class="company-empty">Ainda não há vagas cadastradas para esta empresa.</p>`}
            </section>
            <section class="company-panel company-community" id="companyCommunity">
                <h2>Transparência e comunidade</h2>
                <p>Esta área foi pensada para reunir informações, avaliações e relatos da comunidade sobre experiências profissionais.</p>
                <div class="company-community-note"><strong>Sobre os relatos</strong><p>Denúncias são relatos de usuários e não comprovam, por si só, que uma irregularidade ocorreu. No MVP, não há denúncias ou avaliações reais atribuídas a esta empresa.</p></div>
                <a class="company-outline-button" href="denunciar.html">Relatar uma experiência</a>
            </section>`;
        similarRoot.innerHTML = recommendations.slice(0,4).map(item => miniCard(item)).join("");
        followedRoot.innerHTML = recommendations.slice(4,7).map(item => miniCard(item)).join("");
    }).catch(() => renderError("Não foi possível carregar o perfil","Confira se vagas.json está na mesma pasta e se o site está aberto pelo Live Server."));
}
</script>
</body>
</html>
