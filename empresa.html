const params = new URLSearchParams(window.location.search);
const requestedName = params.get("nome");
const profileRoot = document.getElementById("companyProfile");
const similarRoot = document.getElementById("similarCompanies");
const followedRoot = document.getElementById("followedCompanies");

function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[char]);
}
function slug(value) {
    return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
function companyLink(company) {
    return "empresa.html?nome=" + encodeURIComponent(company.nome);
}
function miniCard(company, label) {
    return `<article class="company-mini">
        <a class="company-mini-logo ${company.theme || ""}" href="${companyLink(company)}">${esc(company.nome.slice(0,1))}</a>
        <div class="company-mini-info">
            <a class="company-mini-name" href="${companyLink(company)}">${esc(company.nome)}</a>
            <p>${esc(company.area)}</p>
            <small>${esc(company.seguidores)} seguidores</small>
            <a class="company-follow" href="${companyLink(company)}">＋ Ver perfil</a>
        </div>
    </article>`;
}
function renderError(title, message) {
    profileRoot.innerHTML = `<section class="company-error"><h1>${esc(title)}</h1><p>${esc(message)}</p><a class="company-button" href="index.html#vagas">Ver vagas</a></section>`;
}
function renderReviews(companyName) {
    const reviews = demoReviews[companyName] || [];
    const total = reviews.length;
    const average = total
        ? reviews.reduce((sum, review) => sum + review.estrelas, 0) / total
        : 0;

    document.getElementById("reviewSummary").innerHTML = `
        <div class="review-summary">
            <strong class="review-average">${average.toFixed(1)}</strong>
            <div>
                <div class="review-stars">${"★".repeat(Math.round(average))}${"☆".repeat(5 - Math.round(average))}</div>
                <p>${total} avaliações de demonstração</p>
            </div>
        </div>
    `;

    document.getElementById("reviewList").innerHTML = reviews.map((review, index) => {
        const key = `pw-helpful-${slug(companyName)}-${index}`;
        const savedVote = localStorage.getItem(key);

        return `
            <article class="review-card">
                <div class="review-card-top">
                    <div class="review-avatar">${esc(review.nome.slice(0, 1))}</div>
                    <div class="review-author">
                        <strong>${esc(review.nome)}</strong>
                        <span>Avaliação fictícia de demonstração</span>
                    </div>
                    <span class="review-demo-badge">Exemplo</span>
                </div>

                <div class="review-stars">
                    ${"★".repeat(review.estrelas)}${"☆".repeat(5 - review.estrelas)}
                </div>

                <p class="review-text">${esc(review.texto)}</p>

                <div class="review-helpful">
                    <span>Esse comentário foi útil a você?</span>
                    <button type="button" data-review="${index}" data-vote="sim"
                        class="${savedVote === "sim" ? "selected" : ""}">
                        Sim
                    </button>
                    <button type="button" data-review="${index}" data-vote="nao"
                        class="${savedVote === "nao" ? "selected" : ""}">
                        Não
                    </button>
                </div>
            </article>
        `;
    }).join("");

    document.querySelectorAll("[data-review]").forEach(button => {
        button.addEventListener("click", () => {
            const key = `pw-helpful-${slug(companyName)}-${button.dataset.review}`;
            localStorage.setItem(key, button.dataset.vote);
            renderReviews(companyName);
        });
    });

    const form = document.getElementById("demoReviewForm");

    form.addEventListener("submit", event => {
        event.preventDefault();

        const stars = Number(document.getElementById("reviewStars").value);
        const text = document.getElementById("reviewText").value.trim();
        const message = document.getElementById("reviewFormMessage");

        if (!text) {
            message.textContent = "Escreva um comentário antes de publicar.";
            return;
        }

        message.textContent =
            "Avaliação de teste registrada apenas nesta demonstração. Ela não foi enviada ao servidor.";
        form.reset();
    }, { once: true });
}

function renderReports(companyName) {
    const reports = demoReports[companyName] || [];

    document.getElementById("companyReportList").innerHTML = reports.map(report => `
        <article class="company-report-card">
            <div class="report-card-top">
                <span class="report-demo-label">Relato fictício</span>
                <span class="report-severity">${esc(report.gravidade)}</span>
            </div>
            <h3>${esc(report.titulo)}</h3>
            <p class="report-date">${esc(report.data)}</p>
            <p>${esc(report.texto)}</p>
        </article>
    `).join("");
}
if (!requestedName) {
    renderError("Empresa não informada","Volte às vagas e selecione o perfil de uma empresa.");
} else {
    Promise.all([
        fetch("vagas.json").then(response => {
            if (!response.ok) throw new Error();
            return response.json();
        })
    ]).then(([vacancies]) => {
        const company = companies.find(item => slug(item.nome) === slug(requestedName));
        if (!company) {
            renderError("Perfil não encontrado","Não encontramos essa empresa no cadastro do PrideWork.");
            return;
        }
        const companyJobs = vacancies.filter(job => slug(job.empresa) === slug(company.nome));
        const related = companies.filter(item => item.nome !== company.nome && item.area === company.area);
        const recommendations = [...related, ...companies.filter(item => item.nome !== company.nome && !related.includes(item))];
        document.title = `${company.nome} | PrideWork`;
        profileRoot.innerHTML = `
            <section class="company-hero">

                    <a href="#companyCommunity">Comunidade</a>
                </nav>
            </section>
            <section class="company-panel" id="overview">
                <h2>Visão geral</h2>
                <p>${esc(company.sobre)}</p>
                <div class="company-facts">
                    <div><span>Setor</span><strong>${esc(company.area)}</strong></div>
                    <div><span>Sede</span><strong>${esc(company.sede)}</strong></div>
                    <div><span>Fundação</span><strong>${esc(company.fundacao)}</strong></div>
                    <div><span>Porte</span><strong>${esc(company.porte)}</strong></div>
                </div>
                <h3>Especialidades</h3>
                <div class="company-specialties">${company.especialidades.map(item => `<span>${esc(item)}</span>`).join("")}</div>
                <p class="company-disclaimer">Perfil e informações criados para demonstração acadêmica do PrideWork. Esta empresa não representa uma organização real.</p>
            </section>
            <section class="company-panel" id="companyJobs">
                <div class="company-section-heading"><div><h2>Vagas em destaque</h2><p>Oportunidades cadastradas para esta empresa.</p></div><span class="company-job-count">${companyJobs.length} ${companyJobs.length === 1 ? "vaga" : "vagas"}</span></div>
                ${companyJobs.length ? `<div class="company-jobs">${companyJobs.map(job => `
                    <article class="company-job">
                        <div class="company-job-icon">${esc(company.nome.slice(0,1))}</div>
                        <div class="company-job-info">
                            <a href="vaga.html?id=${encodeURIComponent(job.id)}">${esc(job.titulo)}</a>
                            <p>${esc(company.nome)} · ${esc(job.localizacao)}</p>
                            <p>${esc(job.modalidade)} · ${esc(job.nivel)} · ${esc(job.tipo)}</p>
                            <strong>${esc(job.salario)}</strong>
                        </div>
                        <a class="company-job-link" href="vaga.html?id=${encodeURIComponent(job.id)}">Ver vaga →</a>
                    </article>`).join("")}</div>` : `<p class="company-empty">Ainda não há vagas cadastradas para esta empresa.</p>`}
            </section>
            <section class="company-panel" id="companyReviews">
    <div class="company-section-heading">
        <div>
            <h2>Avaliações e comentários</h2>
            <p>Opiniões de demonstração sobre a experiência profissional.</p>
        </div>
        <span class="company-job-count">Exemplos fictícios</span>
    </div>

    <div id="reviewSummary"></div>

    <form id="demoReviewForm" class="review-form">
        <h3>Deixe uma avaliação de demonstração</h3>
        <p>Escolha uma nota e escreva um comentário.</p>

        <div class="review-stars-input">
            <label for="reviewStars">Sua nota</label>
            <select id="reviewStars" required>
                <option value="5">★★★★★ - 5 estrelas</option>
                <option value="4">★★★★☆ - 4 estrelas</option>
                <option value="3">★★★☆☆ - 3 estrelas</option>
                <option value="2">★★☆☆☆ - 2 estrelas</option>
                <option value="1">★☆☆☆☆ - 1 estrela</option>
            </select>
        </div>

        <textarea id="reviewText" maxlength="500" required
            placeholder="Escreva seu comentário de teste..."></textarea>

        <button class="company-button" type="submit">
            Publicar avaliação de teste
        </button>
        <p class="review-form-message" id="reviewFormMessage"></p>
    </form>

    <div id="reviewList" class="review-list"></div>
</section>

<section class="company-panel" id="companyReports">
    <div class="company-section-heading">
        <div>
            <h2>Relatos sobre a empresa</h2>
            <p>Exemplos de como os relatos podem aparecer no PrideWork.</p>
        </div>
        <span class="company-job-count">Dados fictícios</span>
    </div>

    <div class="report-demo-notice">
        <strong>Área de demonstração</strong>
        <p>Os casos abaixo foram criados para demonstrar o funcionamento da plataforma. Não são denúncias reais nem afirmações sobre a empresa.</p>
    </div>

    <div id="companyReportList" class="company-report-list"></div>

    <a class="company-outline-button" href="denunciar.html">
        Enviar um relato
    </a>
</section>
            <section class="company-panel company-community" id="companyCommunity">
                <h2>Transparência e comunidade</h2>
                <p>Esta área foi pensada para reunir informações, avaliações e relatos da comunidade sobre experiências profissionais.</p>
                <div class="company-community-note"><strong>Sobre os relatos</strong><p>Denúncias são relatos de usuários e não comprovam, por si só, que uma irregularidade ocorreu. No MVP, não há denúncias ou avaliações reais atribuídas a esta empresa.</p></div>
                <a class="company-outline-button" href="denunciar.html">Relatar uma experiência</a>
            </section>`;
        similarRoot.innerHTML = recommendations.slice(0,4).map(item => miniCard(item)).join("");
        followedRoot.innerHTML = recommendations.slice(4,7).map(item => miniCard(item)).join("");
        renderReviews(company.nome);
renderReports(company.nome);
    }).catch(() => renderError("Não foi possível carregar o perfil","Confira se vagas.json está na mesma pasta e se o site está aberto pelo Live Server."));
}
</script>
