<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vaga - PrideWork</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ==========================================
         CABEÇALHO
    =========================================== -->

    <header>

        <nav class="navbar">

            <a href="PrideWork.html" class="logo">
                Pride<span>Work</span>
            </a>


            <div class="menu">

                <a href="PrideWork.html#vagas">
                    Vagas de emprego
                </a>

                <a href="#">
                    Denunciar
                </a>

                <a href="#">
                    Fórum
                </a>

                <a href="#">
                    Ajuda
                </a>

                <a href="#" class="login">
                    Entrar
                </a>

            </div>

        </nav>

    </header>


    <!-- ==========================================
         CONTEÚDO PRINCIPAL
    =========================================== -->

    <main>

        <section class="vaga-detalhes-container">


            <!-- VOLTAR -->

            <a
                href="PrideWork.html#vagas"
                class="voltar"
            >
                ← Voltar para vagas
            </a>


            <!-- ==================================
                 DETALHES DA VAGA
            =================================== -->

            <div
                id="vagaDetalhes"
                class="vaga-detalhes"
            >

                <p>
                    Carregando vaga...
                </p>

            </div>


        </section>

    </main>


    <!-- ==========================================
         RODAPÉ
    =========================================== -->

    <footer>

        <div class="footer-content">

            <strong>
                PrideWork
            </strong>

            <p>
                © 2026 PrideWork. MVP acadêmico.
            </p>

        </div>

    </footer>


    <!-- ==========================================
         JAVASCRIPT DA PÁGINA
    =========================================== -->

    <script>


        // ==========================================
        // VARIÁVEIS
        // ==========================================

        let vagas = [];

        let vagaAtual = null;


        // ==========================================
        // PEGAR ID DA URL
        // ==========================================

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const id =
            Number(
                parametros.get("id")
            );


        // ==========================================
        // CARREGAR VAGAS
        // ==========================================

        fetch("vagas.json")

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Não foi possível carregar vagas.json"
                    );

                }

                return response.json();

            })


            .then(data => {

                vagas = data;


                // Procurar a vaga pelo ID.

                vagaAtual = vagas.find(
                    vaga => vaga.id === id
                );


                // Verificar se a vaga existe.

                if (!vagaAtual) {

                    document.getElementById(
                        "vagaDetalhes"
                    ).innerHTML = `

                        <div class="erro-vaga">

                            <h2>
                                Vaga não encontrada
                            </h2>

                            <p>
                                Essa oportunidade pode ter sido removida
                                ou não existe.
                            </p>

                        </div>

                    `;

                    return;

                }


                // Atualizar título da página.

                document.title =

                    `${vagaAtual.titulo} - PrideWork`;


                // Mostrar os detalhes.

                mostrarDetalhesDaVaga();

            })


            .catch(error => {

                console.error(
                    "Erro ao carregar vaga:",
                    error
                );


                document.getElementById(
                    "vagaDetalhes"
                ).innerHTML = `

                    <div class="erro-vaga">

                        <h2>
                            Não foi possível carregar a vaga.
                        </h2>

                        <p>
                            Verifique se o arquivo vagas.json
                            está funcionando corretamente.
                        </p>

                    </div>

                `;

            });


        // ==========================================
        // MOSTRAR DETALHES DA VAGA
        // ==========================================

        function mostrarDetalhesDaVaga() {


            // Criar lista de requisitos.

            const requisitos =
                vagaAtual.requisitos
                    .map(
                        requisito =>
                            `<li>${requisito}</li>`
                    )
                    .join("");


            // Criar lista de benefícios.

            const beneficios =
                vagaAtual.beneficios
                    .map(
                        beneficio =>
                            `<li>${beneficio}</li>`
                    )
                    .join("");


            // Inserir conteúdo na página.

            document.getElementById(
                "vagaDetalhes"
            ).innerHTML = `


                <!-- ==================================
                     CABEÇALHO DA VAGA
                =================================== -->

                <div class="vaga-cabecalho">


                    <div>

                        <span class="tag">
                            ${vagaAtual.categoria}
                        </span>


                        <h1>
                            ${vagaAtual.titulo}
                        </h1>


                        <h2>
                            ${vagaAtual.empresa}
                        </h2>


                        <p class="vaga-local">
                            ${vagaAtual.localizacao}
                        </p>

                    </div>


                    <!-- ==================================
                         AÇÕES
                    =================================== -->

                    <div class="vaga-acoes">


                        <button
                            class="botao-candidatar"
                            onclick="candidatarSe()"
                        >

                            Candidatar-se

                        </button>


                        <button
                            class="botao-salvar"
                            onclick="salvarVaga()"
                        >

                            ♡ Salvar vaga

                        </button>


                    </div>


                </div>


                <!-- ==================================
                     GRID PRINCIPAL
                =================================== -->

                <div class="vaga-grid">


                    <!-- ==================================
                         CONTEÚDO PRINCIPAL
                    =================================== -->

                    <div class="vaga-principal">


                        <!-- SOBRE A VAGA -->

                        <section class="vaga-secao">

                            <h2>
                                Sobre a vaga
                            </h2>


                            <p>
                                ${vagaAtual.descricao}
                            </p>

                        </section>


                        <!-- REQUISITOS -->

                        <section class="vaga-secao">

                            <h2>
                                Requisitos
                            </h2>


                            <ul>
                                ${requisitos}
                            </ul>

                        </section>


                        <!-- BENEFÍCIOS -->

                        <section class="vaga-secao">

                            <h2>
                                Benefícios
                            </h2>


                            <ul>
                                ${beneficios}
                            </ul>

                        </section>


                    </div>


                    <!-- ==================================
                         BARRA LATERAL
                    =================================== -->

                    <aside class="vaga-sidebar">


                        <!-- INFORMAÇÕES -->

                        <div class="info-vaga">


                            <h3>
                                Informações
                            </h3>


                            <div class="info-item">

                                <strong>
                                    Salário
                                </strong>

                                <span>
                                    ${vagaAtual.salario}
                                </span>

                            </div>


                            <div class="info-item">

                                <strong>
                                    Modalidade
                                </strong>

                                <span>
                                    ${vagaAtual.modalidade}
                                </span>

                            </div>


                            <div class="info-item">

                                <strong>
                                    Contrato
                                </strong>

                                <span>
                                    ${vagaAtual.tipo}
                                </span>

                            </div>


                            <div class="info-item">

                                <strong>
                                    Nível
                                </strong>

                                <span>
                                    ${vagaAtual.nivel}
                                </span>

                            </div>


                        </div>


                        <!-- EMPRESA -->

                        <div class="empresa-card">


                            <h3>
                                Sobre a empresa
                            </h3>


                            <p>
                                ${vagaAtual.empresa}
                            </p>


                            <a href="#">

                                Ver perfil da empresa →

                            </a>


                        </div>


                    </aside>


                </div>

            `;

        }


        // ==========================================
        // CANDIDATAR-SE
        // ==========================================

        function candidatarSe() {


            // Verificar se uma vaga foi carregada.

            if (!vagaAtual) {

                return;

            }


            // Ir para a página de candidatura
            // levando o ID da vaga.

            window.location.href =
                `candidatura.html?id=${vagaAtual.id}`;

        }


        // ==========================================
        // SALVAR VAGA
        // ==========================================

        function salvarVaga() {

            alert(
                "A função de salvar vagas estará disponível em breve."
            );

        }


    </script>


</body>

</html>
